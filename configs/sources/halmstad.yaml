# Halmstad multi-sensor drone detection dataset (Svanström et al., Data in Brief 2021), CC0-1.0.
# Download manually and unpack to data/raw/halmstad/.
name: halmstad

# Label name in the .mat files -> our class, or null = drop the box but keep the frame as a
# negative example. All drones in this dataset are multirotors.
class_map:
  drone: multirotor
  bird: bird
  airplane: airplane
  helicopter: helicopter

options:
  modalities: [visible] # visible | ir
  # Every clip has a labeled object in (almost) every frame, so background images are cut from
  # the frames: every `every`-th sampled frame gets one crop that keeps `margin` px away from all
  # labeled boxes. `sizes` are crop sides as a fraction of the frame, tried in this order. The
  # crops keep their clip's video id and so stay in its split. every=6 gives ~12 % background.
  background_crops:
    every: 6
    sizes: [0.7, 0.6, 0.5]
    margin: 16
