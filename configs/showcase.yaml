  - {video: V_BIRD_018, start: 0, frames: 135, caption: "Birds are a class of their own"}
  - {video: V_HELICOPTER_041, start: 60, frames: 120, caption: "Helicopters are not drones"}
  - {video: V_AIRPLANE_049, start: 90, frames: 120, caption: "Neither are airplanes"}

