# Ultralytics training overrides. Usage: yolo detect train cfg=configs/train.yaml
model: yolo11s.pt
data: configs/dataset.yaml
imgsz: 1280
epochs: 100
batch: -1 # autobatch (~60 % of GPU memory)
# Each Windows dataloader worker is a full Python process (~1.3 GB), and validation uses twice
# as many. 8 workers peaked at ~29 GB RAM; 2 workers run equally fast (~10 it/s) at ~12 GB.
workers: 2
seed: 0
project: runs/detect
