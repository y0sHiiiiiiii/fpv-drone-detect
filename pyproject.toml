[build-system]
requires = ["setuptools>=77"]  # PEP 639 license string
build-backend = "setuptools.build_meta"

[project]
name = "fpv-drone-detect"
version = "0.1.0"
description = "Offline detection, classification and tracking of small aerial objects in recorded video with YOLO."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
keywords = ["object-detection", "tracking", "yolo", "drone-detection", "small-objects"]
dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
    "scipy",
    "tqdm",
]

[project.urls]
Repository = "https://github.com/y0sHiiiiiiii/fpv-drone-detect"
Experiments = "https://github.com/y0sHiiiiiiii/fpv-drone-detect/tree/main/docs/experiments"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
