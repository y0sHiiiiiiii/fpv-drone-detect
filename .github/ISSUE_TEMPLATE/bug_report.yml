name: Bug report
description: Something in the pipeline does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The full command and the relevant log lines (please no frames or videos).
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python, torch, ultralytics versions, GPU
